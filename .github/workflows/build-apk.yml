name: Build Ajker News APK

on:
  push:
    branches: [main]
    paths:
      - 'app-config/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Version Code (e.g., 1)'
        required: true
        default: '1'
      versionName:
        description: 'Version Name (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Prepare Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.bubblewrap
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.bubblewrap/android.keystore
          ls -la ~/.bubblewrap/
          echo "Keystore ready"

      - name: Init TWA Project
        run: |
          mkdir -p twa-build
          cd twa-build
          bubblewrap init \
            --manifest https://ajkernews.in/manifest.json \
            --directory . \
            --skipPwaCache

      - name: Configure TWA Manifest
        run: |
          cd twa-build
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            m.packageId = 'in.ajkernews.app';
            m.host = 'ajkernews.in';
            m.name = 'Ajker News';
            m.launcherName = 'Ajker News';
            m.appVersionCode = ${{ github.event.inputs.versionCode || 1 }};
            m.appVersionName = '${{ github.event.inputs.versionName || '1.0.0' }}';
            m.enableNotifications = true;
            m.notificationDelegation = true;
            m.webManifestUrl = 'https://ajkernews.in/manifest.json';
            m.signingKey = { 
              path: '/home/runner/.bubblewrap/android.keystore', 
              alias: 'android' 
            };
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
          "

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd twa-build
          bubblewrap build \
            --skipPwaCache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ajkernews-apk-v${{ github.event.inputs.versionName || '1.0.0' }}
          path: twa-build/app-release-signed.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.versionName || '1.0.0' }}
          name: Release v${{ github.event.inputs.versionName || '1.0.0' }}
          files: twa-build/app-release-signed.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
