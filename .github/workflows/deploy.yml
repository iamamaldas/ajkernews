name: Deploy to Cloudflare

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # ম্যানুয়ালি রান করাতে

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      # ১. কোড চেকআউট
      - name: Checkout code
        uses: actions/checkout@v4

      # ২. Node.js সেটআপ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ৩. ডিপেন্ডেন্সি ইন্সটল
      - name: Install dependencies
        run: npm ci

      # ৪. বিল্ড (যদি package.json-এ build script থাকে)
      - name: Build project
        run: npm run build || echo "No build script found"

      # ৫. Cloudflare Pages-এ ডিপ্লয়
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: .  # রুট ডিরেক্টরি (যদি বিল্ড আউটপুট আলাদা হয়, তাহলে পরিবর্তন করুন)
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}

      # ৬. (ঐচ্ছিক) Worker ডিপ্লয়
      - name: Deploy Worker (if wrangler.toml exists)
        run: |
          if [ -f "wrangler.toml" ]; then
            npx wrangler deploy --token ${{ secrets.CLOUDFLARE_API_TOKEN }} --account-id ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          else
            echo "No wrangler.toml found, skipping Worker deployment"
          fi
