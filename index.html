        function getDeviceId() {
            let id = localStorage.getItem('deviceId');
            if (!id) {
                id = 'user-' + Date.now() + '-' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('deviceId', id);
            }
            return id;
        }

        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });
        window.addEventListener('appinstalled', () => {});

        function installApp() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
            if (isStandalone) {
                alert('App already installed!');
                return;
            }
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        alert('App installed successfully!');
                    } else {
                        alert('You can install the app from your browser menu.');
                    }
                    deferredPrompt = null;
                });
                return;
            }
            alert('App already installed!');
        }

        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' }) + ' ' + date.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
        }

        function normalizeNews(news) {
            if (!news || typeof news !== 'object') return null;
            return {
                id: news.id || '',
                headline: news.headline || news.title || news.source_title || news.main_topic || 'সংবাদ',
                summary: news.summary || news.description || '',
                main_topic: news.main_topic || news.headline || '',
                category: news.category || 'general',
                image_url: news.image_url || news.image || news.thumbnail || 'assets/logo.png',
                published_at: news.published_at || news.created_at || '',
                source_name: news.source_name || news.source || 'Ajker News',
                source_url: news.source_url || news.url || '',
                created_at: news.created_at || '',
                score: Number(news.score || 0),
                love_count: Number(news.love_count || 0)
            };
        }

        function getCategoryLabel(category) {
            const labels = { top: 'সেরা খবর', trending: 'ট্রেন্ডিং', all: 'সব খবর', entertainment: 'বিনোদন', general: 'সাধারণ', india: 'ভারত', technology: 'প্রযুক্তি', west_bengal: 'পশ্চিমবঙ্গ', business: 'ব্যবসা', sports: 'খেলা', politics: 'রাজনীতি', world: 'বিশ্ব', kolkata: 'কলকাতা', district: 'জেলা', crime: 'অপরাধ' };
            return labels[category] || category || 'সাধারণ';
        }

        function normalizeSearchText(value) {
            return String(value || '').normalize('NFKC').toLocaleLowerCase().replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/[\p{P}\p{S}]+/gu, ' ').replace(/\s+/g, ' ').trim();
        }

        function scoreSearchResult(news, query) {
            const q = normalizeSearchText(query);
            if (!q) return 0;
            const tokens = q.split(' ').filter(Boolean);
            const fields = [
                normalizeSearchText(news.headline),
                normalizeSearchText(news.main_topic),
                normalizeSearchText(news.summary),
                normalizeSearchText(news.category),
                normalizeSearchText(getCategoryLabel(news.category)),
                normalizeSearchText(news.source_name)
            ];
            const headline = fields[0] + ' ' + fields[1];
            const allText = fields.join(' ');
            let score = 0;
            if (headline === q) score += 1000;
            if (headline.includes(q)) score += 500;
            if (allText.includes(q)) score += 250;
            tokens.forEach(token => {
                if (headline.includes(token)) score += 120;
                else if (allText.includes(token)) score += 55;
                if (fields[0].split(' ').some(w => w.startsWith(token))) score += 80;
            });
            return score;
        }

        function rankSearchResults(newsList, query) {
            const q = normalizeSearchText(query);
            if (!q) return newsList;
            return newsList.map((news, index) => ({ news, index, score: scoreSearchResult(news, q) }))
                .filter(item => item.score > 0)
                .sort((a, b) => b.score - a.score || a.index - b.index)
                .map(item => item.news);
        }

        async function loadNews(category = 'top', search = '', options = {}) {
            const { showLoading = true, keepExisting = false } = options;
            const container = document.getElementById('newsContainer');
            if (isLoadingNews) return;
            isLoadingNews = true;
            currentSearchQuery = search || '';
            if (showLoading && !keepExisting) {
                container.innerHTML = `<div class="empty-news-msg">⏳ খবর লোড হচ্ছে...</div>`;
            }
            try {
                const params = new URLSearchParams();
                params.set('category', category || 'all');
                params.set('_t', Date.now().toString());
                if (search) params.set('q', search);
                const url = API_URL + '?' + params.toString();
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                    cache: 'no-store',
                    credentials: 'omit'
                });
                if (!response.ok) throw new Error('News API HTTP ' + response.status);
                const data = await response.json();
                if (!data || !Array.isArray(data.news)) throw new Error('Invalid news response');

                const urlParams = new URLSearchParams(window.location.search);
                const newsId = urlParams.get('id');
                if (newsId && data.news.length === 0) {
                    window.location.href = '/';
                    return;
                }

                const normalizedNews = data.news.map(normalizeNews).filter(Boolean);
                currentNews = search ? rankSearchResults(normalizedNews, search) : normalizedNews;
                visibleCount = 25;
                renderNews(currentNews);

                if (newsId) {
                    setTimeout(() => openNewsModal(newsId), 200);
                }
            } catch (error) {
                console.error('News loading error:', error);
                if (keepExisting && currentNews.length) return;
                container.innerHTML = `<div class="empty-news-msg">এই মুহূর্তে খবর লোড করা যাচ্ছে না।</div>`;
            } finally {
                isLoadingNews = false;
            }
        }

        // ==================== SHARE (UPDATED - PERFECT LOGIC) ====================
        function shareNews(id, headline, imageUrl) {
            const shareUrl = window.location.origin + '/news?id=' + encodeURIComponent(id);
            const text = headline + ' - Ajker News';

            // শুধুমাত্র রিয়েল ইমেজ থাকলেই URL পাঠাবো (http:// দিয়ে শুরু এবং লোগো নয়)
            const hasValidImage = imageUrl && imageUrl.startsWith('http') && !imageUrl.includes('assets/logo.png');

            if (navigator.share) {
                if (hasValidImage) {
                    // ✅ ছবি থাকলে: URL পাঠান, OG ট্যাগ থেকে ছবি আসবে
                    navigator.share({ title: headline, text: text, url: shareUrl }).catch(() => {});
                } else {
                    // ❌ ছবি না থাকলে: শুধু টেক্সট পাঠান (লিংক ছাড়া) -> লোগো আসবে না
                    navigator.share({ title: headline, text: text }).catch(() => {});
                }
            } else {
                // ডেস্কটপ/অন্যান্য ব্রাউজারে ক্লিপবোর্ডে কপি (এখানে URL দিলেই সমস্যা নেই)
                navigator.clipboard.writeText(shareUrl + ' ' + text)
                    .then(() => alert('লিঙ্ক কপি হয়েছে!'))
                    .catch(() => alert('শেয়ার করুন: ' + shareUrl));
            }
        }

        // ==================== NOTIFICATION ====================
        async function toggleNotification() {
            const btn = document.getElementById('notifyBtn');
            if (!('Notification' in window) || !('PushManager' in window)) {
                alert('এই ব্রাউজারে নোটিফিকেশন সাপোর্টেড নয়।');
                return;
            }

            const registration = await navigator.serviceWorker.ready;
            const existingSub = await registration.pushManager.getSubscription();

            if (existingSub) {
                if (confirm('নোটিফিকেশন বন্ধ করতে চান?')) {
                    await existingSub.unsubscribe();
                    btn.textContent = '🔔';
                    btn.classList.remove('subscribed');
                    alert('নোটিফিকেশন বন্ধ করা হয়েছে।');
                }
                return;
            }

            const permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                alert('নোটিফিকেশন চালু করতে অনুমতি দিন।');
                return;
            }

            try {
                const sub = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
                });

                const res = await fetch(`${WORKER_BASE}/api/subscribe`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(sub)
                });

                if (res.ok) {
                    btn.textContent = '🔔✅';
                    btn.classList.add('subscribed');
                    alert('নোটিফিকেশন চালু হয়েছে! নতুন খবর এলে আমরা জানাব।');
                } else {
                    alert('সাবস্ক্রাইব করতে সমস্যা হয়েছে।');
                }
            } catch (err) {
                console.error('Subscribe error:', err);
                alert('কিছু ভুল হয়েছে। আবার চেষ্টা করুন।');
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            const body = document.getElementById('modal-body');
            delete body.dataset.currentNewsId;
        }
        window.addEventListener('click', function(e) {
            if (e.target === document.getElementById('modal')) closeModal();
        });

        document.getElementById('currentYear').textContent = new Date().getFullYear();

        function startAutomaticNewsRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = setInterval(function() {
                loadNews(currentCategory, currentSearchQuery, { showLoading: false, keepExisting: true });
            }, NEWS_REFRESH_INTERVAL);
        }

        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                const lastRefresh = localStorage.getItem('lastRefreshTime');
                const now = Date.now();
                if (!lastRefresh || (now - parseInt(lastRefresh)) > NEWS_REFRESH_INTERVAL) {
                    loadNews(currentCategory, currentSearchQuery, { showLoading: false, keepExisting: true });
                    localStorage.setItem('lastRefreshTime', String(now));
                }
            }
        });

        async function initializeNewsSystem() {
            await loadNews('top', '', { showLoading: true, keepExisting: false });
            localStorage.setItem('lastRefreshTime', String(Date.now()));
            startAutomaticNewsRefresh();
        }
        initializeNewsSystem();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('Service Worker registered'))
                .catch(err => console.error('SW registration failed:', err));
        }
    </script>
</body>
</html>
