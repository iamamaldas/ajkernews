const PAGE_SIZE = 10;
let hasMoreNews = false;
let deferredPrompt = null;

// ===== HELPERS =====
function sortByLatest(newsArray) {
  if (!Array.isArray(newsArray)) return [];
  return [...newsArray].sort((a, b) => {
    const dateA = new Date(a.created_at || a.published_at || 0).getTime();
    const dateB = new Date(b.created_at || b.published_at || 0).getTime();
    if (dateB !== dateA) return dateB - dateA;
    return (Number(b.score) || 0) - (Number(a.score) || 0);
  });
}

function getDeviceId() {
  let id = localStorage.getItem('deviceId');
  if (!id) {
    id = 'user-' + Date.now() + '-' + Math.random().toString(36).substring(2, 10);
    localStorage.setItem('deviceId', id);
  }
  return id;
}
function isNewsLoved(id) { return localStorage.getItem('loved:' + String(id)) === '1'; }
function setNewsLoved(id, loved) {
  const key = 'loved:' + String(id);
  if (loved) localStorage.setItem(key, '1');
  else localStorage.removeItem(key);
}
function updateLoveUI(id, loved, count) {
  document.querySelectorAll(`[data-love-count="${id}"]`).forEach(el => {
    if (count !== undefined && count !== null) el.textContent = String(count);
  });
  document.querySelectorAll(`[data-love-button="${id}"]`).forEach(btn => {
    btn.classList.toggle('loved', !!loved);
    const svg = btn.querySelector('svg');
    if (svg) {
      svg.setAttribute('fill', loved ? '#e74c3c' : 'none');
      svg.setAttribute('stroke', '#e74c3c');
    }
  });
}
function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function formatDate(dateString) {
  if (!dateString) return '';
  const date = new Date(dateString);
  if (isNaN(date.getTime())) return '';
  return date.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' }) + ' ' + date.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
}
function normalizeNews(news) {
  if (!news || typeof news !== 'object') return null;
  return {
    id: news.id || '',
    headline: news.headline || news.title || news.source_title || news.main_topic || 'সংবাদ',
    summary: news.summary || news.description || '',
    main_topic: news.main_topic || news.headline || '',
    category: news.category || 'general',
    image_url: news.image_url || news.image || news.thumbnail || '/logo.png',
    published_at: news.published_at || news.created_at || '',
    source_name: news.source_name || news.source || 'Ajker News',
    source_url: news.source_url || news.url || '',
    created_at: news.created_at || '',
    score: Number(news.score || 0),
    love_count: parseInt(news.love_count, 10) || 0
  };
}
function getCategoryLabel(category) {
  const labels = { top: 'সেরা খবর', trending: 'ট্রেন্ডিং', all: 'সব খবর', entertainment: 'বিনোদন', general: 'সাধারণ', india: 'ভারত', technology: 'প্রযুক্তি', west_bengal: 'পশ্চিমবঙ্গ', business: 'ব্যবসা', sports: 'খেলা', politics: 'রাজনীতি', world: 'বিশ্ব', kolkata: 'কলকাতা', district: 'জেলা', crime: 'অপরাধ' };
  return labels[category] || category || 'সাধারণ';
}
function normalizeSearchText(value) {
  return String(value || '').normalize('NFKC').toLocaleLowerCase().replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/[\p{P}\p{S}]+/gu, ' ').replace(/\s+/g, ' ').trim();
}

// ===== PWA INSTALL =====
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});
function installApp() {
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
  if (isStandalone) { alert('App already installed!'); return; }
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') alert('App installed!');
      deferredPrompt = null;
    });
    return;
  }
  alert('App installation not supported.');
}

// ===== ✅ REFRESH — Always go to home and reload =====
async function refreshNews() {
  const btn = document.getElementById('refreshBtn');
  if (btn && btn.classList.contains('spinning')) return;
  if (btn) btn.classList.add('spinning');
  
  const currentPath = window.location.pathname;
  if (currentPath.startsWith('/news/')) {
    window.location.href = '/';
    return;
  }
  
  currentCategory = 'top';
  currentSearchQuery = '';
  currentOffset = 0;
  hasMoreNews = false;
  document.getElementById('categoryTitle').innerText = 'সেরা খবর';
  
  try {
    await loadNews('top', '', { showLoading: true, keepExisting: false, autoSpin: false });
  } catch (error) { console.error('Refresh error:', error); }
  finally {
    setTimeout(() => { if (btn) { btn.classList.remove('spinning'); btn.disabled = false; } }, 700);
  }
}

// ===== SKELETON =====
function showSkeleton(container, count = 3) {
  let html = '';
  for (let i = 0; i < count; i++) {
    html += `<div class="news-skeleton"><div class="skeleton-image"></div><div class="skeleton-body"><div class="skeleton-line title"></div><div class="skeleton-line title-2"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div></div>`;
  }
  container.innerHTML = html;
}

// ===== LOAD NEWS =====
async function loadNews(category = 'top', search = '', options = {}) {
  currentOffset = 0;
  const { showLoading = true, keepExisting = false } = options;
  const container = document.getElementById('newsContainer');
  if (isLoadingNews) return;
  isLoadingNews = true;
  currentSearchQuery = search || '';
  if (showLoading && !keepExisting) showSkeleton(container, 3);
  try {
    const params = new URLSearchParams();
    params.set('category', category || 'all');
    params.set('limit', '10');
    if (search) params.set('q', search);
    const url = API_URL + '?' + params.toString();
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    let response;
    try { response = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' }, signal: controller.signal }); }
    finally { clearTimeout(timeoutId); }
    if (!response.ok) throw new Error('News API HTTP ' + response.status);
    const data = await response.json();
    if (!data || !Array.isArray(data.news)) throw new Error('Invalid response');
    const normalized = data.news.map(normalizeNews).filter(Boolean);
    const sorted = sortByLatest(normalized);
    currentNews = sorted;
    visibleCount = 10;
    hasMoreNews = data.has_more || false;
    renderNews(currentNews, hasMoreNews);
    
    try {
      const ids = normalized.map(n => n.id);
      if (ids.length) {
        const loveRes = await fetch(`${WORKER_BASE}/api/love-counts?ids=${encodeURIComponent(ids.join(','))}`);
        const loveData = await loveRes.json();
        if (loveData.success && loveData.counts) {
          Object.keys(loveData.counts).forEach(id => {
            const count = loveData.counts[id];
            const el = document.querySelector(`[data-love-count="${id}"]`);
            if (el) el.textContent = String(count);
          });
        }
      }
    } catch (e) { console.warn('Love counts fetch failed:', e); }
  } catch (error) {
    console.error('News loading error:', error);
    isLoadingNews = false;
    if (!currentNews.length) container.innerHTML = '';
    return;
  }
  isLoadingNews = false;
}

// ===== BUILD NEWS HTML =====
function buildNewsHtml(news) {
  const image = news.image_url || '/logo.png';
  const headline = news.headline || 'সংবাদ';
  const summary = news.summary || '';
  const category = getCategoryLabel(news.category);
  const source = news.source_name || 'Ajker News';
  const displayDate = news.created_at || news.published_at || '';
  const formattedTime = formatDate(displayDate);
  const loved = isNewsLoved(news.id);
  const fill = loved ? '#e74c3c' : 'none';
  const loveCount = Number(news.love_count || 0);
  const safeHeadline = headline.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
  const safeSummary = summary.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
  const articleUrl = `/news/${encodeURIComponent(news.id)}`;

  return `<article class="news-card" data-news-id="${escapeHtml(news.id)}">
    <div class="news-image-wrapper" onclick="window.location.href='${articleUrl}'">
      <img class="news-image" src="${escapeHtml(image)}" alt="${escapeHtml(headline)}" loading="lazy" onerror="this.onerror=null;this.src='/logo.png';">
    </div>
    <div class="news-body">
      <div class="news-category">${escapeHtml(category)}</div>
      <h2 class="news-title" onclick="window.location.href='${articleUrl}'">${escapeHtml(headline)}</h2>
      ${summary ? `<p class="news-summary" onclick="window.location.href='${articleUrl}'">${escapeHtml(summary)}</p>` : ''}
      <div class="news-meta">
        <a href="${articleUrl}" class="news-source-link" onclick="event.stopPropagation();">${escapeHtml(source)}</a>
        <div>${escapeHtml(formattedTime)}</div>
      </div>
      <div class="news-actions">
        <button class="action-btn" onclick="event.stopPropagation(); openCommentModal('${news.id}')">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </button>
        <button class="action-btn love-btn${loved ? ' loved' : ''}" data-love-button="${escapeHtml(news.id)}" onclick="event.stopPropagation(); toggleLove('${news.id}')">
          <svg viewBox="0 0 24 24" fill="${fill}" stroke="#e74c3c" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="action-count" data-love-count="${escapeHtml(news.id)}">${loveCount}</span>
        </button>
        <button class="action-btn" onclick="event.stopPropagation(); shareNews('${news.id}', '${safeHeadline}', '${safeSummary}')">
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
      </div>
    </div>
  </article>`;
}

// ===== RENDER =====
function renderNews(newsList, hasMore = false) {
  const container = document.getElementById('newsContainer');
  if (!Array.isArray(newsList) || !newsList.length) {
    container.innerHTML = '';
    const btn = document.getElementById('loadMoreBtn');
    if (btn) btn.style.display = 'none';
    return;
  }
  const limited = newsList.slice(0, visibleCount);
  container.innerHTML = limited.map(buildNewsHtml).join('');
  requestAnimationFrame(() => {
    container.querySelectorAll('.news-card').forEach(c => c.classList.add('visible'));
  });
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  if (loadMoreBtn) loadMoreBtn.style.display = hasMore ? 'block' : 'none';
}

// ===== LOAD MORE =====
async function loadMoreNews() {
  if (isLoadingNews || !hasMoreNews) return;
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  loadMoreBtn.disabled = true;
  try {
    currentOffset += PAGE_SIZE;
    const params = new URLSearchParams();
    params.set('category', currentCategory || 'top');
    params.set('limit', '10');
    params.set('offset', String(currentOffset));
    if (currentSearchQuery) params.set('q', currentSearchQuery);
    const url = API_URL + '?' + params.toString();
    const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const data = await response.json();
    if (!data.news || data.news.length === 0) {
      hasMoreNews = false;
      loadMoreBtn.style.display = 'none';
      return;
    }
    const newNews = data.news.map(normalizeNews).filter(Boolean);
    currentNews = [...currentNews, ...sortByLatest(newNews)];
    visibleCount = currentNews.length;
    hasMoreNews = data.has_more || false;
    renderNews(currentNews, hasMoreNews);
  } catch (error) { console.error('Load more error:', error); }
  loadMoreBtn.disabled = false;
}

// ===== LOVE =====
async function toggleLove(id) {
  const deviceId = getDeviceId();
  const currentlyLoved = isNewsLoved(id);
  const newLoved = !currentlyLoved;
  const currentCountEl = document.querySelector(`[data-love-count="${id}"]`);
  let currentCount = currentCountEl ? parseInt(currentCountEl.textContent, 10) : 0;
  const newCount = newLoved ? currentCount + 1 : Math.max(0, currentCount - 1);
  setNewsLoved(id, newLoved);
  updateLoveUI(id, newLoved, newCount);
  try {
    const response = await fetch(`${WORKER_BASE}/api/love`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, deviceId })
    });
    const data = await response.json();
    updateLoveUI(id, newLoved, Number(data.love_count || 0));
  } catch (error) { console.error('Love error:', error); }
}

// ===== SHARE =====
async function shareNews(id, headline, summary) {
  const shareUrl = `${SITE_URL}/news/${encodeURIComponent(id)}`;
  const shareText = `${headline}\n\n${summary}\n\n${shareUrl}`;
  if (navigator.share) {
    try { await navigator.share({ text: shareText }); return; } catch (e) {}
  }
  try {
    await navigator.clipboard.writeText(shareText);
    const toast = document.getElementById('copyToast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  } catch (e) { console.error(e); }
}

/* =========================================================
 * NOTIFICATION — FCM
 * ========================================================= */
let notificationSetupInProgress = false;

async function toggleNotification() {
  const btn = document.getElementById('notifyBtn');
  if (notificationSetupInProgress) return;
  if (!('Notification' in window) || !('serviceWorker' in navigator)) {
    alert('এই ব্রাউজারে নোটিফিকেশন সাপোর্টেড নয়।');
    return;
  }
  notificationSetupInProgress = true;
  btn.disabled = true;
  try {
    let attempts = 0;
    while (!window.__firebaseReady && attempts < 20) {
      await new Promise(r => setTimeout(r, 200));
      attempts++;
    }
    if (!window.__firebaseReady) {
      alert('Firebase initialize হয়নি। পেজ reload করুন।');
      return;
    }
    const registration = await navigator.serviceWorker.ready;
    const existingToken = await window.__firebase.getToken(window.__firebase.messaging, {
      vapidKey: window.__VAPID_KEY,
      serviceWorkerRegistration: registration
    }).catch(() => null);
    if (existingToken && Notification.permission === 'granted') {
      if (confirm('নোটিফিকেশন বন্ধ করতে চান?')) {
        await fetch(`${WORKER_BASE}/api/unsubscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ endpoint: existingToken, token: existingToken })
        }).catch(() => {});
        btn.classList.remove('subscribed');
        alert('নোটিফিকেশন বন্ধ।');
      }
      return;
    }
    if (Notification.permission === 'denied') {
      alert('ব্রাউজার নোটিফিকেশন blocked। ব্রাউজার সেটিংস থেকে চালু করুন।');
      return;
    }
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      alert('নোটিফিকেশন চালু করতে অনুমতি দিন।');
      return;
    }
    const fcmToken = await window.__firebase.getToken(window.__firebase.messaging, {
      vapidKey: window.__VAPID_KEY,
      serviceWorkerRegistration: registration
    });
    if (!fcmToken) throw new Error('FCM token পাওয়া যায়নি');
    const res = await fetch(`${WORKER_BASE}/api/subscribe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: fcmToken })
    });
    if (!res.ok) throw new Error('Subscribe HTTP ' + res.status);
    btn.classList.add('subscribed');
    alert('নোটিফিকেশন চালু হয়েছে! নতুন খবর এলে আমরা জানাব।');
  } catch (error) {
    console.error('[FCM] Setup error:', error);
    alert('নোটিফিকেশন চালু করা যায়নি: ' + (error?.message || error));
  } finally {
    notificationSetupInProgress = false;
    btn.disabled = false;
  }
}

async function checkNotificationStatus() {
  if (!('Notification' in window)) return;
  const btn = document.getElementById('notifyBtn');
  if (Notification.permission === 'granted') btn.classList.add('subscribed');
  else btn.classList.remove('subscribed');
}

// ===== COMMENTS =====
async function openCommentModal(id) {
  const modal = document.getElementById('modal');
  const body = document.getElementById('modal-body');
  body.dataset.currentNewsId = id;
  try {
    const response = await fetch(`${WORKER_BASE}/api/comments?id=${id}`);
    const data = await response.json();
    const comments = data.comments || [];
    let html = `<div class="comment-form-container">
      <div style="padding:0 0 8px 0;"><strong>মন্তব্য (${comments.length})</strong></div>
      <input type="text" id="commentAuthor" placeholder="আপনার নাম" style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:4px;">
      <textarea id="commentText" placeholder="মন্তব্য লিখুন..." style="width:100%;padding:8px;margin-bottom:8px;border:1px solid #ddd;border-radius:4px;height:70px;"></textarea>
      <button onclick="submitComment('${id}')" style="background:#000;color:#fff;border:none;padding:8px 15px;border-radius:4px;cursor:pointer;">পাঠান</button>
    </div><div class="comments-list" id="commentsList">`;
    if (comments.length === 0) {
      html += `<div style="color:#888;padding:10px;">প্রথম মন্তব্য করুন!</div>`;
    } else {
      comments.forEach(c => {
        html += `<div style="border-bottom:1px solid #eee;padding:10px 0;"><strong>${escapeHtml(c.author_name)}</strong><p style="margin:5px 0 0;">${escapeHtml(c.comment_text)}</p></div>`;
      });
    }
    html += `</div>`;
    body.innerHTML = html;
    modal.style.display = 'block';
  } catch (error) { console.error('Comment error:', error); }
}

async function submitComment(newsId) {
  const author = document.getElementById('commentAuthor').value.trim() || 'Guest';
  const text = document.getElementById('commentText').value.trim();
  if (!text) return alert('মন্তব্য লিখুন!');
  try {
    await fetch(`${WORKER_BASE}/api/comments`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ newsId, author, text })
    });
    await openCommentModal(newsId);
  } catch (error) { alert('মন্তব্য পাঠানো যায়নি'); }
}

  currentCategory = cat || 'top';
  currentSearchQuery = '';
  const titles = { top: 'সেরা খবর', trending: 'ট্রেন্ডিং', all: 'সব খবর' };

  const modal = document.getElementById('modal');

  fetch(url, { cache: 'no-store' }).then(res => res.text()).then(html => {

  });

}

// ===== NOTIFICATION PROMPT =====
const NOTIFICATION_PROMPT_DELAY = 15000;
const NOTIFICATION_LATER_DELAY = 10 * 60 * 60 * 1000;
const NOTIFICATION_LATER_KEY = 'notifPromptLaterAt';

async function shouldShowNotificationPrompt() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) return false;
  if (Notification.permission === 'granted') return false;
  if (Notification.permission === 'denied') return false;
  const laterAt = parseInt(localStorage.getItem(NOTIFICATION_LATER_KEY) || '0', 10);
  if (laterAt && (Date.now() - laterAt) < NOTIFICATION_LATER_DELAY) return false;
  return true;
}
function showNotificationPrompt() {
  const modal = document.getElementById('notifPromptModal');
  if (modal) modal.classList.add('active');
}
function hideNotificationPrompt() {
  const modal = document.getElementById('notifPromptModal');
  if (modal) modal.classList.remove('active');
}
async function handleNotificationPromptEnable() {
  hideNotificationPrompt();
  await toggleNotification();
}
function handleNotificationPromptLater() {
  localStorage.setItem(NOTIFICATION_LATER_KEY, String(Date.now()));
  hideNotificationPrompt();
}
window.addEventListener('load', () => {
  setTimeout(async () => {
    try {
      const eligible = await shouldShowNotificationPrompt();
      if (eligible) showNotificationPrompt();
    } catch (err) {}
  }, NOTIFICATION_PROMPT_DELAY);
});

      console.log('[SW] Firebase SW registered:', reg.scope);
    } catch (err) {
      console.error('[SW] Firebase SW registration failed:', err);
    }
  }

  await checkNotificationStatus();
})();
</script>
