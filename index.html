<script>
// ===== CONFIG =====
const WORKER_BASE = 'https://ajkernews.ajkernews-1c0.workers.dev';
const API_URL = `${WORKER_BASE}/api/news`;

// ===== STATE =====
let currentCategory = 'top';
let currentSearchQuery = '';
let currentNews = [];
let visibleCount = 10;
let isLoadingNews = false;
let currentOffset = 0;
const PAGE_SIZE = 10;
let hasMoreNews = false;
let deferredPrompt = null;

// ===== PREFETCH STATE =====
let __prefetchData = null;
let __prefetchOffset = 0;

// ===== HELPERS =====
// ✅ Sort by latest (published_at first, then created_at)
function sortByLatest(newsArray) {
  if (!Array.isArray(newsArray)) return [];
  return [...newsArray].sort((a, b) => {
    const dateA = new Date(a.published_at || a.created_at || 0).getTime();
    const dateB = new Date(b.published_at || b.created_at || 0).getTime();
    if (dateB !== dateA) return dateB - dateA;
    // tie-breaker: higher score first
    return (Number(b.score) || 0) - (Number(a.score) || 0);
  });
}

// ===== ADS =====
const PERSONAL_ADS = [
  { id: "ad1", title: "আপনার বিজ্ঞাপন দিন", description: "বাংলার সবচেয়ে বড় নিউজ প্ল্যাটফর্মে বিজ্ঞাপন দিন। লাখ লাখ দর্শকের কাছে পৌঁছান।", link: "https://your-ad-page.com/contact", image: "https://your-image-url.com/ad-banner.png", category: "sponsored" },
  { id: "ad2", title: "বিশেষ অফার", description: "আজই অর্ডার করুন এবং ৫০% ছাড় পান। সীমিত সময়ের অফার।", link: "https://your-offer-page.com", image: "https://your-image-url.com/offer.png", category: "sponsored" }
];
const AD_INTERVAL = 4;
let adIndex = 0;

// ===== UTILITY =====
function getDeviceId() {
  let id = localStorage.getItem('deviceId');
  if (!id) {
    id = 'user-' + Date.now() + '-' + Math.random().toString(36).substring(2, 10);
    localStorage.setItem('deviceId', id);
  }
  return id;
}
function isNewsLoved(id) { return localStorage.getItem('loved:' + String(id)) === '1'; }
function setNewsLoved(id, loved) {
  const key = 'loved:' + String(id);
  if (loved) localStorage.setItem(key, '1');
  else localStorage.removeItem(key);
}
function updateLoveUI(id, loved, count) {
  document.querySelectorAll(`[data-love-count="${id}"]`).forEach(el => {
    if (count !== undefined && count !== null) el.textContent = String(count);
  });
  document.querySelectorAll(`[data-love-button="${id}"]`).forEach(btn => {
    btn.classList.toggle('loved', !!loved);
    const svg = btn.querySelector('svg');
    if (svg) {
      svg.setAttribute('fill', loved ? '#e74c3c' : 'none');
      svg.setAttribute('stroke', '#e74c3c');
    }
  });
}
function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function formatDate(dateString) {
  if (!dateString) return '';
  const date = new Date(dateString);
  return date.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' }) + ' ' + date.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
}
function normalizeNews(news) {
  if (!news || typeof news !== 'object') return null;
  return {
    id: news.id || '',
    headline: news.headline || news.title || news.source_title || news.main_topic || 'সংবাদ',
    summary: news.summary || news.description || '',
    main_topic: news.main_topic || news.headline || '',
    category: news.category || 'general',
    image_url: news.image_url || news.image || news.thumbnail || '/logo.png',
    published_at: news.published_at || news.created_at || '',
    source_name: news.source_name || news.source || 'Ajker News',
    source_url: news.source_url || news.url || '',
    created_at: news.created_at || '',
    score: Number(news.score || 0),
    love_count: Number(news.love_count || 0)
  };
}
function getCategoryLabel(category) {
  const labels = { top: 'সেরা খবর', trending: 'ট্রেন্ডিং', all: 'সব খবর', entertainment: 'বিনোদন', general: 'সাধারণ', india: 'ভারত', technology: 'প্রযুক্তি', west_bengal: 'পশ্চিমবঙ্গ', business: 'ব্যবসা', sports: 'খেলা', politics: 'রাজনীতি', world: 'বিশ্ব', kolkata: 'কলকাতা', district: 'জেলা', crime: 'অপরাধ' };
  return labels[category] || category || 'সাধারণ';
}
function normalizeSearchText(value) {
  return String(value || '').normalize('NFKC').toLocaleLowerCase().replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/[\p{P}\p{S}]+/gu, ' ').replace(/\s+/g, ' ').trim();
}
function scoreSearchResult(news, query) {
  const q = normalizeSearchText(query);
  if (!q) return 0;
  const tokens = q.split(' ').filter(Boolean);
  const fields = [
    normalizeSearchText(news.headline),
    normalizeSearchText(news.main_topic),
    normalizeSearchText(news.summary),
    normalizeSearchText(news.category),
    normalizeSearchText(getCategoryLabel(news.category)),
    normalizeSearchText(news.source_name)
  ];
  const headline = fields[0] + ' ' + fields[1];
  const allText = fields.join(' ');
  let score = 0;
  if (headline === q) score += 1000;
  if (headline.includes(q)) score += 500;
  if (allText.includes(q)) score += 250;
  tokens.forEach(token => {
    if (headline.includes(token)) score += 120;
    else if (allText.includes(token)) score += 55;
    if (fields[0].split(' ').some(w => w.startsWith(token))) score += 80;
  });
  return score;
}
function rankSearchResults(newsList, query) {
  const q = normalizeSearchText(query);
  if (!q) return newsList;
  return newsList.map((news, index) => ({ news, index, score: scoreSearchResult(news, q) }))
    .filter(item => item.score > 0)
    .sort((a, b) => b.score - a.score || a.index - b.index)
    .map(item => item.news);
}
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

// ===== PWA INSTALL =====
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});
window.addEventListener('appinstalled', () => { console.log('PWA installed'); });
function installApp() {
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
  if (isStandalone) { alert('App already installed!'); return; }
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') alert('App installed successfully!');
      else alert('You can install the app from your browser menu.');
      deferredPrompt = null;
    });
    return;
  }
  alert('App installation not supported or already installed.');
}

// ===== REFRESH =====
async function refreshNews() {
  const btn = document.getElementById('refreshBtn');
  if (isLoadingNews || btn.classList.contains('spinning')) return;
  btn.classList.add('spinning');
  btn.disabled = true;
  const startedAt = Date.now();
  const MIN_SPIN_MS = 700;
  try {
    __prefetchData = null;
    __prefetchOffset = 0;
    await loadNews(currentCategory || 'top', currentSearchQuery || '', {
      showLoading: true,
      keepExisting: false,
      autoSpin: false
    });
  } catch (error) {
    console.error('Refresh error:', error);
  } finally {
    const elapsed = Date.now() - startedAt;
    if (elapsed < MIN_SPIN_MS) {
      await new Promise(r => setTimeout(r, MIN_SPIN_MS - elapsed));
    }
    btn.classList.remove('spinning');
    btn.disabled = false;
  }
}

// ===== SKELETON LOADER =====
function showSkeleton(container, count = 3) {
  let html = '';
  for (let i = 0; i < count; i++) {
    html += `<div class="news-skeleton">
      <div class="skeleton-image"></div>
      <div class="skeleton-body">
        <div class="skeleton-line" style="width:25%; height:12px;"></div>
        <div class="skeleton-line title"></div>
        <div class="skeleton-line title-2"></div>
        <div class="skeleton-line text"></div>
        <div class="skeleton-line text-2"></div>
        <div class="skeleton-line text-3"></div>
        <div class="skeleton-line meta"></div>
      </div>
    </div>`;
  }
  container.innerHTML = html;
}

// ===== LOAD NEWS =====
async function loadNews(category = 'top', search = '', options = {}) {
  currentOffset = 0;
  const { showLoading = true, keepExisting = false, autoSpin = true } = options;
  const container = document.getElementById('newsContainer');
  if (isLoadingNews) return;
  isLoadingNews = true;

  const refreshBtn = document.getElementById('refreshBtn');
  const shouldRestoreSpin = autoSpin && refreshBtn && !refreshBtn.classList.contains('spinning');
  if (shouldRestoreSpin) refreshBtn.classList.add('spinning');

  currentSearchQuery = search || '';
  if (showLoading && !keepExisting) {
    showSkeleton(container, 3);
  }
  try {
    const params = new URLSearchParams();
    params.set('category', category || 'all');
    params.set('limit', '10');
    if (search) params.set('q', search);
    const url = API_URL + '?' + params.toString();
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    let response;
    try {
      response = await fetch(url, {
        method: 'GET',
        headers: { 'Accept': 'application/json' },
        cache: 'default',
        credentials: 'omit',
        signal: controller.signal
      });
    } finally {
      clearTimeout(timeoutId);
    }
    if (!response.ok) throw new Error('News API HTTP ' + response.status);
    const data = await response.json();
    if (!data || !Array.isArray(data.news)) throw new Error('Invalid news response');
    const normalizedNews = data.news.map(normalizeNews).filter(Boolean);
    // ✅ Always show latest news first (sort by published_at, then created_at)
    const sortedNews = sortByLatest(normalizedNews);
    currentNews = search ? rankSearchResults(sortedNews, search) : sortedNews;
    visibleCount = 10;
    hasMoreNews = data.has_more || false;
    renderNews(currentNews, hasMoreNews);
  } catch (error) {
    console.error('News loading error:', error);
    isLoadingNews = false;
    if (shouldRestoreSpin && refreshBtn) refreshBtn.classList.remove('spinning');
    const attempts = options.__retry || 0;
    if (attempts < 3) {
      setTimeout(() => {
        loadNews(category, search, {
          ...options,
          showLoading: false,
          keepExisting: true,
          __retry: attempts + 1,
          autoSpin: false
        });
      }, 2000);
    } else if (!currentNews.length) {
      container.innerHTML = '';
    }
    return;
  }
  isLoadingNews = false;
  if (shouldRestoreSpin && refreshBtn) refreshBtn.classList.remove('spinning');

  if (hasMoreNews) prefetchNextPage();
}

// ===== BUILD NEWS HTML =====
function buildNewsHtml(news) {
  const image = news.image_url || '/logo.png';
  const headline = news.headline || news.main_topic || 'সংবাদ';
  const summary = news.summary || '';
  const category = getCategoryLabel(news.category);
  const source = news.source_name || 'Ajker News';
  const displayDate = news.created_at || news.published_at || '';
  const formattedTime = formatDate(displayDate);
  const sourceLink = news.source_url
    ? `<a href="javascript:void(0)" onclick="openNewsModal('${news.id}')">${escapeHtml(source)}</a>`
    : `<span>${escapeHtml(source)}</span>`;
  const safeHeadline = headline.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
  const safeSummary = summary.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
  const loved = isNewsLoved(news.id);
  const fill = loved ? '#e74c3c' : 'none';

  return `<article class="news-card" data-news-id="${escapeHtml(news.id)}">
    <div class="news-image-wrapper">
      <img class="news-image" src="${escapeHtml(image)}" alt="${escapeHtml(headline)}" loading="lazy" decoding="async" onload="this.classList.add('loaded'); this.parentElement.classList.add('loaded');" onerror="this.onerror=null;this.src='/logo.png';this.classList.add('loaded');this.parentElement.classList.add('loaded');">
    </div>
    <div class="news-body">
      <div class="news-category">${escapeHtml(category)}</div>
      <h2 class="news-title">${escapeHtml(headline)}</h2>
      ${summary ? `<p class="news-summary">${escapeHtml(summary)}</p>` : ''}
      <div class="news-meta">
        <div class="news-source">${sourceLink}</div>
        <div class="news-time">${escapeHtml(formattedTime)}</div>
      </div>
      <div class="news-actions">
        <button class="action-btn" onclick="openCommentModal('${news.id}')" title="মন্তব্য">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </button>
        <button class="action-btn love-btn${loved ? ' loved' : ''}" data-love-button="${escapeHtml(news.id)}" onclick="toggleLove('${news.id}')" title="ভালোবাসা">
          <svg viewBox="0 0 24 24" fill="${fill}" stroke="#e74c3c" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          <span class="action-count" data-love-count="${escapeHtml(news.id)}">${news.love_count}</span>
        </button>
        <button class="action-btn" onclick="shareNews('${news.id}', '${safeHeadline}', '${safeSummary}')" title="শেয়ার">
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
      </div>
    </div>
  </article>`;
}

// ===== BUILD AD HTML =====
function buildAdHtml(ad) {
  return `<a href="${escapeHtml(ad.link)}" target="_blank" rel="noopener sponsored" class="ad-card">
    <div class="news-body">
      <div class="ad-badge">📢 বিজ্ঞাপন</div>
      <div class="news-category">${escapeHtml(ad.category || 'sponsored')}</div>
      <h2 class="news-title">${escapeHtml(ad.title)}</h2>
      <p class="news-summary">${escapeHtml(ad.description)}</p>
      <div style="margin-top:10px; font-size:13px; color:#ff6b6b; font-weight:600;">বিস্তারিত জানতে ক্লিক করুন →</div>
    </div>
  </a>`;
}

// ===== RENDER NEWS =====
function renderNews(newsList, hasMore = false) {
  const container = document.getElementById('newsContainer');
  if (!Array.isArray(newsList) || !newsList.length) {
    if (container.querySelector('.news-skeleton')) container.innerHTML = '';
    const btn = document.getElementById('loadMoreBtn');
    if (btn) btn.style.display = 'none';
    return;
  }

  const limitedNews = newsList.slice(0, visibleCount);
  container.innerHTML = '';

  let index = 0;
  let adCounter = 0;

  function showNext() {
    if (index >= limitedNews.length) {
      const loadMoreBtn = document.getElementById('loadMoreBtn');
      if (hasMore) {
        loadMoreBtn.style.display = 'block';
        loadMoreBtn.disabled = false;
      } else {
        loadMoreBtn.style.display = 'none';
      }
      return;
    }

    const wrapper = document.createElement('div');
    wrapper.innerHTML = buildNewsHtml(limitedNews[index]);
    const card = wrapper.firstElementChild;
    container.appendChild(card);

    requestAnimationFrame(() => { card.classList.add('visible'); });

    index++;
    adCounter++;

    if (adCounter === AD_INTERVAL && index > 3 && index < limitedNews.length) {
      const ad = getNextAd();
      if (ad) {
        const adWrapper = document.createElement('div');
        adWrapper.innerHTML = buildAdHtml(ad);
        container.appendChild(adWrapper.firstElementChild);
      }
      adCounter = 0;
    }

    if (index < 4) {
      requestAnimationFrame(showNext);
    } else {
      setTimeout(showNext, 20);
    }
  }

  showNext();
}

function getNextAd() {
  if (!PERSONAL_ADS || PERSONAL_ADS.length === 0) return null;
  const ad = PERSONAL_ADS[adIndex % PERSONAL_ADS.length];
  adIndex++;
  return ad;
}

// ===== LOAD MORE =====
async function loadMoreNews() {
  if (isLoadingNews) return;
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const shouldSpin = refreshBtn && !refreshBtn.classList.contains('spinning');
  if (shouldSpin) refreshBtn.classList.add('spinning');

  loadMoreBtn.style.display = 'none';
  loadMoreBtn.disabled = true;

  if (__prefetchData && __prefetchOffset === currentOffset + PAGE_SIZE) {
    const data = __prefetchData;
    __prefetchData = null;
    __prefetchOffset = 0;
    currentOffset += PAGE_SIZE;
    if (!data.news || !data.news.length) {
      hasMoreNews = false;
      loadMoreBtn.disabled = true;
      loadMoreBtn.style.display = 'none';
      if (shouldSpin && refreshBtn) refreshBtn.classList.remove('spinning');
      return;
    }
    const newNews = data.news.map(normalizeNews).filter(Boolean);
    // ✅ Sort new page latest first
    const sortedNewNews = sortByLatest(newNews);
    currentNews = [...currentNews, ...sortedNewNews];
    visibleCount = currentNews.length;
    hasMoreNews = data.has_more || false;
    renderNews(currentNews, hasMoreNews);
    loadMoreBtn.disabled = false;
    if (shouldSpin && refreshBtn) refreshBtn.classList.remove('spinning');
    if (hasMoreNews) prefetchNextPage();
    return;
  }

  try {
    currentOffset += PAGE_SIZE;
    const params = new URLSearchParams();
    params.set('category', currentCategory || 'top');
    params.set('limit', '10');
    params.set('offset', String(currentOffset));
    if (currentSearchQuery) params.set('q', currentSearchQuery);
    const url = API_URL + '?' + params.toString();
    const response = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' }, cache: 'no-store' });
    if (!response.ok) throw new Error('API error');
    const data = await response.json();
    if (!data.news || data.news.length === 0) {
      hasMoreNews = false;
      loadMoreBtn.disabled = true;
      loadMoreBtn.style.display = 'none';
      if (shouldSpin && refreshBtn) refreshBtn.classList.remove('spinning');
      return;
    }
    const newNews = data.news.map(normalizeNews).filter(Boolean);
    // ✅ Sort new page latest first
    const sortedNewNews = sortByLatest(newNews);
    currentNews = [...currentNews, ...sortedNewNews];
    visibleCount = currentNews.length;
    hasMoreNews = data.has_more || false;
    renderNews(currentNews, hasMoreNews);
    loadMoreBtn.disabled = false;
    if (hasMoreNews) prefetchNextPage();
  } catch (error) {
    console.error('Load more error:', error);
    loadMoreBtn.disabled = false;
    loadMoreBtn.style.display = 'none';
  }
  if (shouldSpin && refreshBtn) refreshBtn.classList.remove('spinning');
}

// ===== Prefetch next page =====
async function prefetchNextPage() {
  if (!hasMoreNews) return;
  const nextOffset = currentOffset + PAGE_SIZE;
  try {
    const params = new URLSearchParams();
    params.set('category', currentCategory || 'top');
    params.set('limit', '10');
    params.set('offset', String(nextOffset));
    if (currentSearchQuery) params.set('q', currentSearchQuery);
    const url = API_URL + '?' + params.toString();
    const response = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' } });
    if (!response.ok) return;
    const data = await response.json();
    __prefetchData = data;
    __prefetchOffset = nextOffset;
  } catch (_) {}
}

// ===== LOVE =====
async function toggleLove(id) {
  const deviceId = getDeviceId();
  const currentlyLoved = isNewsLoved(id);
  const newLoved = !currentlyLoved;
  const currentCountEl = document.querySelector(`[data-love-count="${id}"]`);
  let currentCount = currentCountEl ? parseInt(currentCountEl.textContent, 10) : 0;
  const newCount = newLoved ? currentCount + 1 : currentCount - 1;
  setNewsLoved(id, newLoved);
  updateLoveUI(id, newLoved, newCount);
  const news = currentNews.find(n => n.id === id);
  if (news) news.love_count = newCount;
  try {

      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, deviceId })
    });
    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      throw new Error(errorData.error || 'Server error');
    }
    const data = await response.json();
    const finalCount = Number(data.love_count || 0);
    updateLoveUI(id, newLoved, finalCount);
    if (news) news.love_count = finalCount;
  } catch (error) {
    console.error('Love error:', error);
    setNewsLoved(id, currentlyLoved);
    updateLoveUI(id, currentlyLoved, currentCount);
    if (news) news.love_count = currentCount;
  }
}

// ===== SHARE =====
async function copyShareText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { console.warn('Clipboard API failed:', e); }
  try {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.setAttribute('readonly', '');
    textarea.style.position = 'fixed';
    textarea.style.left = '-9999px';
    textarea.style.top = '0';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    textarea.setSelectionRange(0, textarea.value.length);
    const copied = document.execCommand('copy');
    textarea.remove();
    return !!copied;
  } catch (e) {
    console.error('Legacy copy failed:', e);
    return false;
  }
}
async function shareNews(id, headline, summary) {
  const cleanHeadline = String(headline || '').replace(/\s+/g, ' ').trim();
  let cleanSummary = String(summary || '').replace(/\s+/g, ' ').trim();
  const MAX_SUMMARY = 150;
  if (cleanSummary.length > MAX_SUMMARY) {
    let cutIndex = cleanSummary.lastIndexOf(' ', MAX_SUMMARY);
    if (cutIndex === -1) cutIndex = MAX_SUMMARY;
    cleanSummary = cleanSummary.substring(0, cutIndex) + '...';
  }
  const shareUrl = 'https://ajkernews.in/news/' + encodeURIComponent(id);
  const shareText = cleanSummary
    ? `${cleanHeadline}\n\n${cleanSummary}\n\nপূর্ণ খবর দেখতে এই লিঙ্কে ক্লিক করুন\n${shareUrl}`
    : `${cleanHeadline}\n\nপূর্ণ খবর দেখতে এই লিঙ্কে ক্লিক করুন\n${shareUrl}`;
  if (typeof navigator.share === 'function') {
    try {
      await navigator.share({ text: shareText });
      return;
    } catch (error) {
      if (error && error.name === 'AbortError') return;
      console.warn('Native share failed:', error);
    }
  }
  const copied = await copyShareText(shareText);
  const toast = document.getElementById('copyToast');
  if (toast) {
    toast.textContent = copied ? 'লিংক কপি হয়েছে' : 'লিংক কপি করা যায়নি';
    toast.classList.add('show');
    clearTimeout(window.__copyToastTimer);
    window.__copyToastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }
}

// ===== NOTIFICATION =====
let notificationSetupInProgress = false;
async function toggleNotification() {
  const btn = document.getElementById('notifyBtn');
  if (notificationSetupInProgress) return;
  if (!('Notification' in window) || !('PushManager' in window)) {
    alert('এই ব্রাউজারে নোটিফিকেশন সাপোর্টেড নয়।');
    return;
  }
  const registration = await navigator.serviceWorker.ready;
  const existingSub = await registration.pushManager.getSubscription();
  if (existingSub) {
    if (confirm('আপনি কি নোটিফিকেশন বন্ধ করতে চান?')) {
      await existingSub.unsubscribe();
      await fetch(`${WORKER_BASE}/api/unsubscribe`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ endpoint: existingSub.endpoint })
      }).catch(() => {});
      btn.classList.remove('subscribed');
      alert('নোটিফিকেশন বন্ধ করা হয়েছে।');
    }
    return;
  }
  if (Notification.permission === 'denied') {
    alert('ব্রাউজার নোটিফিকেশন অনুমতি বন্ধ করে রেখেছে। ব্রাউজার সেটিংস থেকে অনুমতি চালু করুন।');
    return;
  }
  notificationSetupInProgress = true;
  btn.disabled = true;
  try {
    if (Notification.permission === 'default') {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        alert('নোটিফিকেশন চালু করতে অনুমতি দিন।');
        return;
      }
    }
    let lastError = null;
    for (let attempt = 1; attempt <= 2; attempt++) {
      try {
        const configRes = await fetch(`${WORKER_BASE}/api/push-config`, { cache: 'no-store' });
        if (!configRes.ok) throw new Error('Push config HTTP ' + configRes.status);
        const config = await configRes.json();
        if (!config.publicKey) throw new Error('No VAPID public key');
        const sub = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(config.publicKey)
        });
        const res = await fetch(`${WORKER_BASE}/api/subscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sub)
        });
        if (!res.ok) throw new Error('Subscribe HTTP ' + res.status);
        btn.classList.add('subscribed');
        alert('নোটিফিকেশন চালু হয়েছে! নতুন খবর এলে আমরা জানাব।');
        if ('serviceWorker' in navigator && 'SyncManager' in window) {
          try {
            await registration.sync.register('sync-pending-notifications');
          } catch (e) { console.warn('Background sync registration failed:', e); }
        }
        return;
      } catch (err) {
        lastError = err;
        console.error('Subscribe attempt ' + attempt + ' failed:', err);
        if (attempt === 1) await new Promise(resolve => setTimeout(resolve, 700));
      }
    }
    console.error('Notification setup failed after retry:', lastError);
    alert('নোটিফিকেশন চালু করা যায়নি। আবার পরে চেষ্টা করুন।');
  } finally {
    notificationSetupInProgress = false;
    btn.disabled = false;
  }
}

async function checkNotificationStatus() {
  if (!('Notification' in window) || !('PushManager' in window)) return;
  try {
    const registration = await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.getSubscription();
    const btn = document.getElementById('notifyBtn');
    let osGranted = Notification.permission === 'granted';
    try {
      const perm = await navigator.permissions.query({ name: 'notifications' });
      osGranted = perm.state === 'granted';
    } catch (_) {}
    if (subscription && osGranted) {
      btn.classList.add('subscribed');
    } else {
      btn.classList.remove('subscribed');
    }
  } catch (e) { console.error('Status check error:', e); }
}

async function syncMissedNotifications() {
  if (!navigator.onLine || !('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const registration = await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.getSubscription();
    if (!subscription) return;
    await fetch(`${WORKER_BASE}/api/push-sync`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(subscription)
    });
  } catch (e) { console.warn('Missed notification sync failed:', e); }
}
window.addEventListener('online', () => { syncMissedNotifications(); });

// ===== Smart notification click flow =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', async (event) => {
    const data = event.data || {};
    if (data.type !== 'OPEN_NEWS_URL') return;

    let id = data.newsId || '';
    if (!id && data.url) {
      try {
        const parsed = new URL(data.url, location.origin);
        id = parsed.searchParams.get('id')
          || parsed.pathname.split('/').filter(Boolean).pop()
          || '';
      } catch (_) {}
    }

    try {
      if (id) {
        const u = new URL(location.href);
        u.searchParams.delete('shared');
        u.searchParams.set('id', id);
        history.replaceState({}, '', u.toString());
      }
      await loadNews('top', '', { showLoading: true, keepExisting: false, autoSpin: true });
      if (id) await showSharedNewsFirst(id);
      const reg = await navigator.serviceWorker.ready;
      if (reg.active) reg.active.postMessage({ type: 'CLEAR_NOTIFICATIONS' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      console.warn('Notification flow failed:', err);
    }
  });
}

/* ===== NOTIFICATION PROMPT SYSTEM ===== */
const NOTIFICATION_PROMPT_DELAY = 10000;
const NOTIFICATION_LATER_DELAY = 10 * 60 * 60 * 1000;
const NOTIFICATION_LATER_KEY = 'notifPromptLaterAt';

async function shouldShowNotificationPrompt() {
  if (!('Notification' in window) || !('PushManager' in window)) return false;
  if (Notification.permission === 'granted') return false;
  if (Notification.permission === 'denied') return false;
  const laterAt = parseInt(localStorage.getItem(NOTIFICATION_LATER_KEY) || '0', 10);
  if (laterAt && (Date.now() - laterAt) < NOTIFICATION_LATER_DELAY) return false;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) return false;
  } catch (_) {}
  return true;
}
function showNotificationPrompt() {
  const modal = document.getElementById('notifPromptModal');
  if (modal) modal.classList.add('active');
}
function hideNotificationPrompt() {
  const modal = document.getElementById('notifPromptModal');
  if (modal) modal.classList.remove('active');
}
async function handleNotificationPromptEnable() {
  hideNotificationPrompt();
  if (typeof toggleNotification === 'function') await toggleNotification();
}
function handleNotificationPromptLater() {
  localStorage.setItem(NOTIFICATION_LATER_KEY, String(Date.now()));
  hideNotificationPrompt();
}
window.addEventListener('load', () => {
  setTimeout(async () => {
    try {
      const eligible = await shouldShowNotificationPrompt();
      if (eligible) showNotificationPrompt();
    } catch (err) { console.warn('Notification prompt check failed:', err); }
  }, NOTIFICATION_PROMPT_DELAY);
});

// ===== INIT =====
(async function initApp() {
  const urlParams = new URLSearchParams(window.location.search);
  const sharedQueryId = urlParams.get('shared');
  const legacyNewsId = urlParams.get('id');
  const goPath = window.location.pathname;
  const goId = goPath.startsWith('/go/') ? decodeURIComponent(goPath.split('/')[2] || '') : null;

  const pathMatch = window.location.pathname.match(/^\/news\/([^\/]+)/);
  const pathId = pathMatch ? decodeURIComponent(pathMatch[1]) : null;

  const sharedId = sharedQueryId || legacyNewsId || goId || pathId;

  if (sharedId) {
    loadNews('top', '', { showLoading: true, keepExisting: false, autoSpin: true })
      .then(() => showSharedNewsFirst(sharedId))
      .catch(() => {});
  } else {
    loadNews('top', '', { showLoading: true, keepExisting: false, autoSpin: true });
  }

  (async () => {
    if ('serviceWorker' in navigator) {
      try {
        const reg = await navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' });
        if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        reg.update().catch(() => {});
        if ('SyncManager' in window) {
          try { await reg.sync.register('sync-pending-notifications'); } catch (_) {}
        }
      } catch (err) { console.error('SW registration failed:', err); }
    }
    await checkNotificationStatus();
  })();
})();
</script>
