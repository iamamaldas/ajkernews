cd ~/ajkernews

cat > wrangler.toml << 'EOF'
name = "ajkernews"
main = "src/index.js"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ajkernews-db"
database_id = "f10f96b7-8bed-4c7c-a580-483d2a77e5ae"

[triggers]
crons = ["0 */3 * * *"]

[observability]
enabled = true
EOF
