name = "ajkernews"
main = "src/index.js"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../"
binding = "ASSETS"
run_worker_first = ["/*"]
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "ajkernews-db"
database_id = "f10f96b7-8bed-4c7c-a580-483d2a77e5ae"

[vars]
SITE_ORIGIN = "https://ajkernews.in"
WORKER_ORIGIN = "https://ajkernews.ajkernews-1c0.workers.dev"

[triggers]
crons = [
  "0 */2 * * *",
  "15 */2 * * *",
  "35 */2 * * *",
  "50 */2 * * *"
]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[observability.traces]
enabled = true
persist = true
